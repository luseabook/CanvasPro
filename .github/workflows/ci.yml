name: Canvas CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Export test Python path
        shell: bash
        run: echo "AIC_TEST_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Obfuscation gate
        run: npm run check:obfuscation

      - name: JavaScript unit tests
        run: npm run test:js

      - name: Backend Python tests
        run: npm run test:backend

      - name: Migration checks
        run: npm run test:migrations

      - name: Package structure checks
        run: npm run check:package
