<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>发送到 AI CanvasPro 无限画布</title>
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/themes/light.css" />
    <link rel="stylesheet" href="../styles/global-capture-window.css" />
  </head>
  <body>
    <main id="capturePanel" class="global-capture" aria-label="选中文字快捷操作">
      <div id="actionList" class="global-capture__toolbar" role="toolbar" aria-label="发送到画布">
        <button
          class="global-capture__action"
          type="button"
          data-action-id="source-text"
          data-icon="add-to-canvas"
          aria-label="收集为源文本"
          aria-keyshortcuts="1"
        >
          <span>收集</span>
        </button>
        <span class="global-capture__divider" aria-hidden="true"></span>
        <button
          class="global-capture__action"
          type="button"
          data-action-id="ai-text"
          data-icon="text"
          aria-keyshortcuts="2"
        >
          <span data-action-label>AI 文本</span>
        </button>
        <button
          class="global-capture__action"
          type="button"
          data-action-id="ai-image"
          data-icon="image"
          aria-keyshortcuts="3"
        >
          <span data-action-label>AI 生图</span>
        </button>
        <button
          class="global-capture__action"
          type="button"
          data-action-id="ai-video"
          data-icon="video"
          aria-keyshortcuts="4"
        >
          <span data-action-label>AI 视频</span>
        </button>
        <span class="global-capture__divider" aria-hidden="true"></span>
        <button
          id="moreToggle"
          class="global-capture__action global-capture__more"
          type="button"
          aria-label="更多操作"
          title="更多操作"
          aria-expanded="false"
          aria-controls="captureDetails"
        >
          <span class="global-capture__spinner" aria-hidden="true"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.6" />
            <circle cx="12" cy="12" r="1.6" />
            <circle cx="19" cy="12" r="1.6" />
          </svg>
        </button>
      </div>
      <section id="captureDetails" class="global-capture__details" aria-label="更多操作" hidden>
        <div class="global-capture__preview-label"><span>选中文字</span><span id="textCount"></span></div>
        <p id="textPreview" class="global-capture__preview" tabindex="0" aria-label="选中文字"></p>
        <button
          class="global-capture__option"
          type="button"
          data-action-id="preset-draft"
          data-icon="save"
          aria-keyshortcuts="5"
        >
          <span>存为提示词预设</span><kbd>5</kbd>
        </button>
        <button
          id="runImmediatelyToggle"
          class="global-capture__option global-capture__toggle"
          type="button"
          role="switch"
          aria-checked="false"
        >
          <span>AI 节点立即生成</span>
          <span class="global-capture__toggle-track" aria-hidden="true"
            ><span class="global-capture__toggle-thumb"></span
          ></span>
        </button>
      </section>
      <div id="captureFeedback" class="global-capture__feedback" role="status" aria-live="polite" hidden>
        <span class="global-capture__spinner" aria-hidden="true"></span>
        <div class="global-capture__feedback-copy">
          <p id="captureStatus"></p>
          <p id="captureHint" class="global-capture__hint"></p>
        </div>
        <button id="retryAction" class="global-capture__retry" type="button" hidden>重试</button>
        <button
          id="closeCapture"
          class="global-capture__close"
          type="button"
          data-icon="cancel"
          aria-label="关闭"
          title="关闭（Esc）"
        ></button>
      </div>
    </main>
    <script type="module" src="./globalCaptureWindow.js"></script>
  </body>
</html>
