<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>Screenshot Overlay</title>
    <link rel="stylesheet" href="../styles/screenshot-overlay.css" />
  </head>
  <body>
    <div id="root" class="screenshot-overlay-root is-idle">
      <img id="screenImage" class="screenshot-overlay-image" alt="" />
      <div id="shadeTop" class="screenshot-overlay-shade"></div>
      <div id="shadeRight" class="screenshot-overlay-shade"></div>
      <div id="shadeBottom" class="screenshot-overlay-shade"></div>
      <div id="shadeLeft" class="screenshot-overlay-shade"></div>
      <div id="selection" class="screenshot-overlay-selection">
        <span class="screenshot-overlay-handle" data-handle="nw"></span>
        <span class="screenshot-overlay-handle" data-handle="n"></span>
        <span class="screenshot-overlay-handle" data-handle="ne"></span>
        <span class="screenshot-overlay-handle" data-handle="e"></span>
        <span class="screenshot-overlay-handle" data-handle="se"></span>
        <span class="screenshot-overlay-handle" data-handle="s"></span>
        <span class="screenshot-overlay-handle" data-handle="sw"></span>
        <span class="screenshot-overlay-handle" data-handle="w"></span>
      </div>
      <div id="toolbar" class="screenshot-overlay-toolbar">
        <button id="confirmBtn" class="screenshot-overlay-button is-confirm" type="button" title="确定">
          ✓
        </button>
        <button id="cancelBtn" class="screenshot-overlay-button is-cancel" type="button" title="取消">
          ×
        </button>
      </div>
      <div id="magnifier" class="screenshot-overlay-magnifier">
        <canvas
          id="magnifierCanvas"
          class="screenshot-overlay-magnifier-canvas"
          width="174"
          height="174"
        ></canvas>
        <div id="magnifierInfo" class="screenshot-overlay-magnifier-info">POS: (0, 0) RGB: (0,0,0)</div>
      </div>
    </div>
    <canvas id="workCanvas" hidden></canvas>
    <script src="./screenshotOverlay.js"></script>
  </body>
</html>
